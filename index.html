<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste da digital</title>
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Teste digital">
<style>
  :root { --fundo:#f6f4ef; --texto:#1d1d1b; --suave:#5c5a55; --linha:#d6d2c8; --cartao:#ffffff; --acento:#1f3a5f; --ok:#1e6b3a; --erro:#a3261b; }
  @media (prefers-color-scheme: dark) {
    :root { --fundo:#16181b; --texto:#ecebe7; --suave:#a8a69f; --linha:#34373c; --cartao:#1f2226; --acento:#8fb3e0; --ok:#6fcf8f; --erro:#f08a7e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fundo); color:var(--texto); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { color:var(--suave); margin:0 0 24px; }
  section { background:var(--cartao); border:1px solid var(--linha); border-radius:12px; padding:16px; margin-bottom:16px; }
  h2 { font-size:1rem; margin:0 0 8px; }
  button { font:inherit; font-weight:600; min-height:44px; padding:10px 16px; border-radius:10px; border:0; background:var(--acento); color:var(--cartao); cursor:pointer; width:100%; }
  button:disabled { opacity:.45; cursor:default; }
  textarea { font:inherit; width:100%; min-height:80px; padding:10px; border-radius:10px; border:1px solid var(--linha); background:var(--fundo); color:var(--texto); margin-bottom:10px; }
  .estado { margin-top:10px; font-size:.95rem; }
  .ok { color:var(--ok); } .erro { color:var(--erro); }
  ul#checagens { list-style:none; padding:0; margin:0; }
  ul#checagens li { padding:4px 0; border-bottom:1px solid var(--linha); }
  ul#checagens li:last-child { border-bottom:0; }
  pre { white-space:pre-wrap; word-break:break-word; font-size:.8rem; color:var(--suave); margin:10px 0 0; }
  .rede { display:inline-block; font-size:.85rem; padding:2px 10px; border-radius:99px; border:1px solid var(--linha); }
</style>
</head>
<body>
<main>
  <h1>Teste da digital</h1>
  <p class="sub">Página descartável. Não guarda nem envia nenhum dado: tudo fica neste aparelho. <span class="rede" id="rede"></span></p>

  <section>
    <h2>1. O que este aparelho suporta</h2>
    <ul id="checagens"><li>Conferindo…</li></ul>
  </section>

  <section>
    <h2>2. Criar a chave</h2>
    <button id="criar">Criar chave com a digital</button>
    <div class="estado" id="estado-criar"></div>
  </section>

  <section>
    <h2>3. Trancar um texto</h2>
    <textarea id="texto">Texto de exemplo para trancar.</textarea>
    <button id="trancar" disabled>Trancar com a digital</button>
    <div class="estado" id="estado-trancar"></div>
  </section>

  <section>
    <h2>4. Abrir o texto</h2>
    <p class="sub" style="margin:0 0 10px">Para o teste completo: feche o app, ligue o modo avião, abra de novo e toque aqui.</p>
    <button id="abrir" disabled>Abrir com a digital</button>
    <div class="estado" id="estado-abrir"></div>
  </section>

  <section>
    <h2>Relatório</h2>
    <button id="copiar">Copiar relatório</button>
    <div class="estado" id="estado-copiar"></div>
    <pre id="relatorio"></pre>
  </section>

  <section>
    <button id="limpar" style="background:var(--erro)">Apagar o teste deste aparelho</button>
  </section>
</main>
<script src="teste.js"></script>
</body>
</html>
